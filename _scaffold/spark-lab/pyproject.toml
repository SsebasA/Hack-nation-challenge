[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sparklab"
version = "0.1.0"
description = "SPARK Lab: Surprise -> Propose -> Attack -> Run -> Keep/Kill on NHANES, orchestrated by Omnigent"
requires-python = ">=3.12"
dependencies = ["pandas>=2.2", "numpy>=1.26", "scipy>=1.11", "pyyaml>=6"]

[tool.setuptools]
packages = ["sparklab"]
